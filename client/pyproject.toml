[project]
name = "matplotlib-to-originlab"
version = "0.1.0"
description = "Convert matplotlib figures to OriginLab graphs — unified client"
authors = [{name = "y-marui"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.6.3,<4",
    "matplotlib-to-originlab-remote",
    # Core is only installed on Windows; on other platforms the remote backend is used.
    "matplotlib-to-originlab-core; sys_platform == 'win32'",
]

# Install for all users:
#   pip install matplotlib-to-originlab
#
# On Windows with OriginLab installed, Origin will be used directly (local mode).
# On other platforms (or Windows without Origin), jobs are forwarded to a
# matplotlib-to-originlab-server instance (remote mode).

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.uv.sources]
matplotlib-to-originlab-remote = { workspace = true }
matplotlib-to-originlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
