[tool.poetry]
name = "matplotlib-to-originlab-remote"
version = "0.1.0"
description = "HTTP client for matplotlib-to-originlab-server — cross-platform"
authors = ["y-marui"]
readme = "README.md"
license = "MIT"
packages = [{include = "matplotlib_to_originlab_remote"}]

# All OS (Windows, macOS, Linux).
# Used by matplotlib-to-originlab when OriginLab is not available locally.

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<10.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
