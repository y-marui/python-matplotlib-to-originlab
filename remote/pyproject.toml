[project]
name = "matplotlib-to-originlab-remote"
version = "0.1.0"
description = "HTTP client for matplotlib-to-originlab-server — cross-platform"
authors = [{name = "y-marui"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
]

# All OS (Windows, macOS, Linux).
# Used by matplotlib-to-originlab when OriginLab is not available locally.

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22,<1",
    "matplotlib>=3.6.3,<4",
    "numpy>=1.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
