[project]
name = "matplotlib-to-originlab-server"
version = "0.1.0"
description = "Origin execution node — receives plot jobs from matplotlib-to-originlab clients"
authors = [{name = "y-marui"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib-to-originlab-core",
]

# Install on the machine that has OriginLab:
#   pip install matplotlib-to-originlab-server
#
# Windows + OriginLab required.

[project.optional-dependencies]
# Web framework (planned — see ROADMAP.md)
server = [
    "fastapi>=0.135.3,<0.142.0",
    "uvicorn>=0.44,<0.53",
]

[project.scripts]
matplotlib-to-originlab-server = "matplotlib_to_originlab_server.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.28.1,<0.29",
    # fastapi/uvicorn are runtime-optional ([project.optional-dependencies] server),
    # but the HTTP-layer test suite needs fastapi/starlette to run (not just skip).
    "fastapi>=0.135.3,<0.142.0",
    "starlette",
]

[tool.uv.sources]
matplotlib-to-originlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
