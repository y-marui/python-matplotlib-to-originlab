# Monorepo root — not an installable package.
# Each sub-package has its own pyproject.toml:
#
#   core/    → matplotlib-to-originlab-core   (local execution engine, Windows + Origin)
#   client/  → matplotlib-to-originlab        (user-facing client, all platforms)
#   remote/  → matplotlib-to-originlab-remote (HTTP client)
#   server/  → matplotlib-to-originlab-server (Origin execution node, Windows)
#
# This is a uv workspace (see [tool.uv.workspace] below) — a single
# `uv sync` from the repo root installs all sub-packages in editable mode.
# To work on just one sub-package: `uv sync --package matplotlib-to-originlab-core` etc.

[project]
name = "matplotlib-to-originlab-monorepo"
version = "0.1.0"
description = "Monorepo root for the matplotlib-to-originlab ecosystem"
authors = [{name = "y-marui"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

# This is not an installable package itself — just a workspace root.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "client", "remote", "server"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "autopep8>=2.0.1,<3",
    "ipykernel>=6.20.2,<7",
    "ruff",
    "mypy",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# importlib mode avoids __init__.py namespace conflicts when running tests
# from multiple sub-packages at once.
addopts = ["--import-mode=importlib"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
# Lint only the cross-platform packages; core/ is Windows-only.
exclude = ["core", "client", "sample", "Documentation", "tests"]
# docs/dev-charter/ is a git subtree we cannot edit directly (see
# AI_CONTEXT.md); recent ruff formats fenced Python blocks in Markdown
# by default, which would otherwise flag it.
extend-exclude = ["docs/dev-charter"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — not enforced (formatter handles layout)
    "F841",   # local variable assigned but never used (common in WIP code)
]

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# Keep strict checking off for now; tighten per-package as needed.
warn_unused_ignores = false

[[tool.mypy.overrides]]
# matplotlib / numpy stubs are incomplete; suppress attr/arg errors in remote.
module = ["matplotlib_to_originlab_remote.*"]
ignore_errors = true
