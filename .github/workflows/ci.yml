name: CI

on:
  push:
    branches: [main, update-charter]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.github/FUNDING.yml'
              - '!.github/CODEOWNERS'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/*_TEMPLATE.md'
              - '!.github/pull_request_template.md'
              - '!.github/copilot-instructions.md'
              - '!.github/workflows/dev-charter-check.yml'
              - '!.github/workflows/auto-assign-self.yml'

  # ---------------------------------------------------------------------------
  # Security scan (pre-commit / gitleaks)
  # ---------------------------------------------------------------------------
  security:
    name: Security scan (pre-commit)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks requires full history

      - uses: pre-commit/action@v3.0.1
        env:
          # powershell-lint is a local-only convenience check (see
          # .pre-commit-config.yaml); it isn't required to gate merges.
          SKIP: powershell-lint

  # ---------------------------------------------------------------------------
  # Lint & type check (Linux, no Origin required)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install lint tools
        run: |
          uv pip install --system \
            ruff \
            mypy \
            httpx \
            fastapi \
            starlette \
            matplotlib \
            numpy

      - name: ruff check
        run: ruff check remote/ server/

      - name: ruff format check
        run: ruff format --check remote/ server/

      - name: mypy — remote
        run: mypy remote/matplotlib_to_originlab_remote

      - name: mypy — server app
        run: mypy server/matplotlib_to_originlab_server/app.py server/matplotlib_to_originlab_server/db.py

  # ---------------------------------------------------------------------------
  # Tests — Origin-free (Linux)
  # Covers: remote (respx mock) + server HTTP layer (FastAPI TestClient + mocked worker/db)
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Linux / Origin-free, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]  # EOLまで6ヶ月以上あるバージョン

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install runtime + test dependencies
        run: |
          uv pip install --system \
            "fastapi>=0.100" \
            "httpx>=0.28" \
            starlette \
            matplotlib \
            numpy \
            pytest \
            respx \
            anyio
          # Install packages without pulling in Windows-only core or originpro
          uv pip install --system --no-deps -e remote/ -e server/

      - name: pytest — remote
        run: pytest remote/tests/ -v --tb=short

      - name: pytest — server (HTTP layer)
        run: pytest server/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Build — installability check (aggregates all required jobs)
  # This is the single status check required by the branch ruleset.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [changes, security, lint, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install packages
        run: |
          uv pip install --system -e remote/ -e server/

      - name: Verify imports
        run: |
          python -c "import matplotlib_to_originlab_remote"
          python -c "import matplotlib_to_originlab_server"

  gate:
    name: CI
    needs: [changes, security, lint, test, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::security did not succeed (got: ${{ needs.security.result }})"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "docs/config-only change; nothing further to verify"
            exit 0
          fi
          for result in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed (got: $result)"
              exit 1
            fi
          done
