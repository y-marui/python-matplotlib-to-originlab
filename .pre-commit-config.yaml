exclude: |
  (?x)^(
    node_modules/|
    vendor/|
    \.git/|
    dist/|
    build/|
    __pycache__/|
    poetry\.lock$
  )

repos:
  # ----------------------------------------------------------------
  # Security (required — verified by global git hook)
  # ----------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Required: SSH private key detection
      - id: detect-private-key

      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict

  # Required: .env file check (hook id contains "detect-dotenv")
  - repo: local
    hooks:
      - id: detect-dotenv
        name: Block .env files
        language: fail
        entry: '.env ファイルはコミット禁止。ダミー値のみの .env.example を使うこと。'
        files: '(^|/)\.env(\.[^.]+)?$'
        exclude: '(^|/)\.env\.(example|sample|template)$'

  # ----------------------------------------------------------------
  # Hardcoded local absolute paths
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-hardcoded-local-paths
        name: Block hardcoded local absolute paths
        language: pygrep
        entry: '(/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|C:\\Users\\)'
        types_or: [text]
        exclude: |
          (?x)(
            \.md$|
            docs/|
            \.github/|
            \.gitleaks\.toml$|
            \.pre-commit-config\.yaml$|
            OriginTemplates/|
            Documentation/
          )

  # ----------------------------------------------------------------
  # Charter CI template check
  # (blocks if .github/workflows/dev-charter-check.yml drifted from the
  # template documented in the installed dev-charter's README-jp.md)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-charter-ci-template
        name: Check charter CI template
        language: script
        entry: scripts/check-charter-ci-template.sh
        pass_filenames: false
        always_run: true

  # ----------------------------------------------------------------
  # Markdown section headings
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-markdown-heading-language
        name: Check Markdown section heading language
        language: script
        entry: scripts/check-markdown-heading-language.sh
        files: '\.md$'

  # ----------------------------------------------------------------
  # Linting & formatting (ruff)
  # ----------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^(core|client|sample|Documentation)/'
      - id: ruff-format
        exclude: '^(core|client|sample|Documentation)/'

  # ----------------------------------------------------------------
  # PowerShell scripts
  # (PSScriptAnalyzer, installed locally on first run. Skipped in CI —
  # see ci.yml's SKIP env — it isn't required to gate merges; it exists
  # for local parity with the Linux/macOS shellcheck coverage above,
  # for scripts/*.ps1 counterparts of the bash scripts.)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: powershell-lint
        name: PowerShell script lint (PSScriptAnalyzer)
        language: system
        entry: >-
          bash -c '
          if ! command -v pwsh >/dev/null 2>&1; then
          echo "warning: pwsh not found; skipping PowerShell lint" >&2;
          exit 0;
          fi;
          pwsh -NoProfile -NonInteractive -File scripts/check-powershell-lint.ps1 "$@"
          ' --
        files: '\.ps1$'
        require_serial: true

  # ----------------------------------------------------------------
  # Local dev-charter version check
  # (blocks if sibling ../dev-charter is newer, warns if older)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-local-charter-version
        name: Check local dev-charter version
        language: script
        entry: scripts/check-local-charter-version.sh
        pass_filenames: false
        always_run: true
